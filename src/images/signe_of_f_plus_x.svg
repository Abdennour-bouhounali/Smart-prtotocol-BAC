<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 180" width="550" height="180">
  <style>
    .math { font-family: 'Times New Roman', Times, serif; font-size: 20px; }
    .italic { font-style: italic; }
    .line { stroke: black; stroke-width: 1.5; }
    .sign { font-family: 'Times New Roman', Times, serif; font-size: 24px; }
    .zero { font-family: 'Times New Roman', Times, serif; font-size: 16px; }
    .arabic { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; direction: rtl; }
  </style>

  <!-- Outer border -->
  <rect x="10" y="10" width="530" height="160" fill="white" stroke="black" stroke-width="1.5" />
  
  <!-- Horizontal line separating rows -->
  <line x1="10" y1="60" x2="540" y2="60" class="line" />
  <line x1="10" y1="110" x2="540" y2="110" class="line" />
  
  <!-- Vertical line separating headers from content -->
  <line x1="120" y1="10" x2="120" y2="170" class="line" />

  <!-- First column (Headers) -->
  <text x="65" y="42" class="math italic" text-anchor="middle">x</text>
  <text x="65" y="92" class="math" text-anchor="middle"><tspan class="italic">f</tspan>(<tspan class="italic">x</tspan>)+<tspan class="italic">x</tspan></text>
  <text x="65" y="145" class="arabic" text-anchor="middle">الوضع النسبي</text>

  <!-- Top row values -->
  <text x="150" y="42" class="math" text-anchor="middle">0</text>
  <text x="340" y="42" class="math" text-anchor="middle"><tspan class="italic">e</tspan><tspan dy="-10" font-size="14px">-3/2</tspan></text>
  <text x="500" y="42" class="math" text-anchor="middle">+∞</text>

  <!-- Bottom row signs -->
  <text x="245" y="92" class="sign" text-anchor="middle">-</text>
  <text x="440" y="92" class="sign" text-anchor="middle">+</text>

  <!-- Third row positions -->
  <text x="245" y="145" class="arabic" text-anchor="middle">(Cf) تحت (Δ)</text>
  <text x="440" y="145" class="arabic" text-anchor="middle">(Cf) فوق (Δ)</text>

  <!-- Vertical bar for e^{-3/2} across row 2 and 3 -->
  <line x1="340" y1="60" x2="340" y2="170" class="line" />
  
  <!-- Intersection label -->
  <rect x="290" y="128" width="100" height="24" fill="white" />
  <text x="340" y="145" class="arabic" text-anchor="middle">يقطع</text>

  <!-- The zero circle on the vertical bar in sign row -->
  <circle cx="340" cy="85" r="7" fill="white" stroke="white" />
  <text x="340" y="90" class="zero" text-anchor="middle">0</text>

  <!-- Double line for 0 indicating not defined -->
  <line x1="150" y1="60" x2="150" y2="170" class="line" />
  <line x1="154" y1="60" x2="154" y2="170" class="line" />

</svg>
